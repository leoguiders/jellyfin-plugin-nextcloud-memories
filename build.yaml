version: "1.1.1.0"
targetAbi: "10.11.0.0"
framework: "net9.0"
overview: "Mirrors photos and videos from Nextcloud Memories into a Jellyfin library."
description: >
  Synchronises photos, albums and videos from the Nextcloud app "Memories" through its
  HTTP API into a local cache directory and exposes that directory as a regular
  "Home Videos & Photos" library in Jellyfin. Jellyfin and Nextcloud do not need to
  share a filesystem.
category: "General"
owner: "leoguiders"
artifacts:
  - "Jellyfin.Plugin.NextcloudMemories.dll"
changelog: >
  1.1.1.0 - Code, configuration page and documentation translated to English.
  Mirror directories renamed to Timeline and Albums; the next sync re-downloads
  unless the old folders are renamed manually. CI can publish releases again.
  1.1.0.0 - The index is checkpointed during the sync, so cancelling no longer
  discards the work done so far. A running sync can be cancelled from the
  configuration page or via POST /NextcloudMemories/Stop.
  1.0.0.0 - Initial release: timeline, albums, videos via .strm proxy,
  metadata enrichment, scheduled sync.
